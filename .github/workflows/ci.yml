name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # No pnpm cache: pnpm-lock.yaml is gitignored (install uses --no-frozen-lockfile)

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Verify webview bundle markers
        run: node scripts/verify-vsix-webview.js dist/webview/index.js

      - name: Test
        run: pnpm test

      - name: Lint
        run: npx eslint src/
